name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sim_africa
      ORDER_ACCESS_SECRET: ci-order-access-secret
      NEXTAUTH_SECRET: ci-nextauth-secret
      METRICS_BEARER_TOKEN: ci-metrics-token
      DPO_IPN_SECRET: ci-dpo-ipn-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production watchdog tests
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm run security:audit
